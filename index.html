<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Tattoo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="status">Loading model...</div>
    <div id="panel">
      <label id="upload-btn">
        Upload Design
        <input type="file" id="file-input" accept="image/*" hidden>
      </label>
      <div id="size-row">
        <label>Width <input type="number" id="size-input" value="8" min="1" max="30" step="0.5"> cm</label>
      </div>
      <div id="part-row">
        <select id="part-select">
          <option value="forearm" selected>Forearm</option>
          <option value="upperarm">Upper Arm</option>
        </select>
        <label>Position <input type="range" id="placement-input" min="0" max="1" step="0.05" value="0.5"></label>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
